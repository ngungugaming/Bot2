<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minecraft AFK Bot - Điều Khiển</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e7e9ee;
    --muted: #9aa3b2;
    --accent: #4ade80;
    --accent-off: #f87171;
    --brand: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px;
  }
  .app { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 16px; }

  /* 1. Top bar - trạng thái */
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
  }
  .status-bar h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #status-badge {
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(248,113,113,0.15);
    color: var(--accent-off);
  }
  #status-badge.on { background: rgba(74,222,128,0.15); color: var(--accent); }
  #status-badge.connecting { background: rgba(56,189,248,0.15); color: var(--brand); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  label { font-size: 13px; color: var(--muted); margin-bottom: 4px; display: block; }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: var(--brand); }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }

  /* 4. Khu vực chat */
  #chat-log {
    height: 260px;
    overflow-y: auto;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .chat-line { line-height: 1.4; word-break: break-word; }
  .chat-line .from { color: var(--brand); font-weight: 600; margin-right: 6px; }
  .chat-line.outgoing .from { color: var(--accent); }
  .chat-line.system { color: var(--muted); font-style: italic; }

  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row input { flex: 1; }

  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    transition: opacity 0.15s ease;
  }
  button:hover { opacity: 0.85; }
  button:active { opacity: 0.7; }
  #btn-send { background: var(--brand); color: #04121c; }
  #btn-login { background: var(--accent); color: #04140a; width: 100%; padding: 12px; font-size: 15px; }
  #btn-login.connected { background: var(--accent-off); color: #1a0505; }

  #listen-indicator {
    font-size: 12px;
    color: var(--muted);
  }
  #listen-indicator.active { color: var(--accent); }

  #msa-box {
    display: none;
    background: rgba(56,189,248,0.1);
    border: 1px solid var(--brand);
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
  }
  #msa-box a { color: var(--brand); }

  #log-box {
    max-height: 120px;
    overflow-y: auto;
    font-size: 12px;
    color: var(--muted);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
</style>
</head>
<body>
<div class="app">

  <!-- 1. TOP BAR - TRẠNG THÁI -->
  <div class="status-bar">
    <h1>Minecraft AFK Bot</h1>
    <div>Trạng thái: <span id="status-badge">OFF</span></div>
  </div>

  <!-- Hộp mã đăng nhập Microsoft (ẩn cho tới khi cần) -->
  <div id="msa-box" class="panel"></div>

  <!-- 2. Ô nhập tài khoản -->
  <div class="panel">
    <div>
      <label for="username">Tên tài khoản (Email / Xbox Gamertag)</label>
      <input type="text" id="username" placeholder="Nhập email hoặc Gamertag Xbox" />
    </div>
  </div>

  <!-- 3. Thông tin máy chủ -->
  <div class="panel">
    <div>
      <label for="server-name">Tên máy chủ</label>
      <input type="text" id="server-name" value="CatMine" />
    </div>
    <div class="row">
      <div>
        <label for="server-ip">IP máy chủ</label>
        <input type="text" id="server-ip" value="catmine.net" />
      </div>
      <div style="max-width:140px;">
        <label for="server-port">Cổng (Port)</label>
        <input type="number" id="server-port" value="19132" />
      </div>
    </div>
  </div>

  <!-- 4. Khu vực chat (log ở TRÊN, ô nhập ở DƯỚI) -->
  <div class="panel">
    <label>Nơi nhận tin nhắn</label>
    <div id="chat-log"></div>
    <div id="listen-indicator">Cửa sổ nhận tin nhắn: đang tắt (gửi tin để bật trong 2 phút)</div>
    <div class="chat-input-row">
      <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." />
      <button id="btn-send">Gửi</button>
    </div>
  </div>

  <!-- 5. Nút điều khiển -->
  <div class="panel">
    <button id="btn-login">Đăng Nhập</button>
  </div>

  <!-- Nhật ký hệ thống -->
  <div class="panel">
    <label>Nhật ký hoạt động</label>
    <div id="log-box"></div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
